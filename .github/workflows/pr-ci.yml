name: PR CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # PR87 targets the stacked PR86 branch, not main. Run the same gate on its pushes.
  push:
    branches:
      - codex/cru21-decision-quality-p0-20261016
      - codex/cru21-ui-clarity-p1-20261022
      - codex/cru21-ui-auth-acceptance-20261023
      - codex/cru21-emergency-market-calendar-qa-20261023
      - codex/cru21-preopen-integrated-candidate-20261023
      - codex/cru21-flow-freshness-repair-20261027
      - codex/cru61-smc-cvd-profile-v1

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Secret scan
        run: npm run security:scan

      # The hosted VM can cold-fault the Chrome binary for >10s before CDP
      # responds. Prime only Chrome's page cache; retain the real browser test,
      # its exact 12s deadline, all assertions and CI job time limits.
      - name: Warm installed Chrome for hermetic browser test
        timeout-minutes: 1
        run: |
          /usr/bin/google-chrome --version
          timeout 25s /usr/bin/google-chrome \
            --headless=new --no-sandbox --disable-gpu --disable-extensions \
            --disable-background-networking --no-first-run --no-default-browser-check \
            --disable-dev-shm-usage \
            --user-data-dir="${RUNNER_TEMP}/shiheng-chrome-warmup" \
            --dump-dom 'data:text/html,%3Ctitle%3Eready%3C/title%3E' > /dev/null

      # Use the installed stable Chromium-family build verified in the #294 A/B diagnostic.
      # Same full lane, real browser, isolation, assertions and 12/30 second deadlines.
      - name: Hermetic PR gate
        id: hermetic_gate
        env:
          CRU21_TEST_BROWSER_PATH: /usr/bin/google-chrome
        run: npm run test:ci

      # Diagnostic only: the original gate remains failed even if this passes.
      - name: Isolated guest-runtime diagnostic after gate failure
        if: ${{ failure() && steps.hermetic_gate.outcome == 'failure' && github.ref == 'refs/heads/codex/cru21-decision-quality-p0-20261016' }}
        timeout-minutes: 3
        run: |
          echo 'Diagnostic only; this does not replace or override the full gate.'
          git rev-parse HEAD
          uname -sr
          node --version
          npm --version
          node --test tests/cru21-guest-runtime.test.mjs
